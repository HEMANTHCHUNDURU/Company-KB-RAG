<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Knowledge Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 20px 40px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f1f5f9;
    }

    header span {
      font-size: 24px;
    }

    header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    #chat-container {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.user .avatar { background: #3b82f6; }
    .message.bot  .avatar { background: #7c3aed; }

    .bubble {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
    }

    .message.user .bubble {
      background: #3b82f6;
      color: white;
      border-top-right-radius: 4px;
    }

    .message.bot .bubble {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-top-left-radius: 4px;
    }

    .source-tag {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    #input-area {
      width: 100%;
      max-width: 800px;
      padding: 16px 20px 24px;
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      color: #e2e8f0;
      outline: none;
      transition: border 0.2s;
    }

    #question-input:focus {
      border-color: #3b82f6;
    }

    #question-input::placeholder { color: #475569; }

    #send-btn {
      background: #3b82f6;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover { background: #2563eb; }
    #send-btn:active { transform: scale(0.96); }
    #send-btn:disabled { background: #334155; cursor: not-allowed; }

    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
    }

    .welcome h2 { font-size: 22px; color: #94a3b8; margin-bottom: 10px; }
    .welcome p  { font-size: 14px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .suggestion {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <header>
    <span>🧠</span>
    <div>
      <h1>Company Knowledge Assistant</h1>
      <p>Ask anything about internal policies, onboarding & processes</p>
    </div>
  </header>

  <div id="chat-container">
    <div class="welcome" id="welcome">
      <h2>How can I help you today?</h2>
      <p>Ask me anything about company documentation</p>
      <div class="suggestions">
        <div class="suggestion" onclick="askSuggestion(this)">What is the leave policy?</div>
        <div class="suggestion" onclick="askSuggestion(this)">How do I submit an expense?</div>
        <div class="suggestion" onclick="askSuggestion(this)">What is the notice period?</div>
        <div class="suggestion" onclick="askSuggestion(this)">How does onboarding work?</div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <input
      type="text"
      id="question-input"
      placeholder="Ask about HR, policies, onboarding..."
      onkeydown="if(event.key==='Enter') sendQuestion()"
    />
    <button id="send-btn" onclick="sendQuestion()">➤</button>
  </div>

<script>
  const chat = document.getElementById("chat-container");
  const input = document.getElementById("question-input");
  const btn = document.getElementById("send-btn");

  function askSuggestion(el) {
    input.value = el.textContent;
    sendQuestion();
  }

  function addMessage(role, text) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "🧠";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // Extract sources from answer text
    if (role === "bot") {
      const sourceMatches = [...text.matchAll(/\[Source: ([^\]]+)\]/g)];
      const cleanText = text.replace(/\[Source: [^\]]+\]\n?/g, "").trim();
      bubble.innerHTML = `<p>${cleanText.replace(/\n/g, "<br>")}</p>`;
      sourceMatches.forEach(m => {
        const tag = document.createElement("span");
        tag.className = "source-tag";
        tag.textContent = "📄 " + m[1];
        bubble.appendChild(tag);
      });
    } else {
      bubble.textContent = text;
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const msg = document.createElement("div");
    msg.className = "message bot";
    msg.id = "typing-indicator";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🧠";

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";

    msg.appendChild(avatar);
    msg.appendChild(typing);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-indicator");
    if (t) t.remove();
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    addMessage("user", question);
    input.value = "";
    btn.disabled = true;
    addTyping();

    try {
      const res = await fetch("http://localhost:8000/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await res.json();
      removeTyping();
      addMessage("bot", data.answer);
    } catch (err) {
      removeTyping();
      addMessage("bot", "⚠️ Could not connect to backend. Make sure app.py is running.");
    }

    btn.disabled = false;
    input.focus();
  }
</script>

</body>
</html>
